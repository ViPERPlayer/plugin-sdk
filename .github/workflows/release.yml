name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5

      # v1.2.3 -> 1.2.3
      - name: Derive version from tag
        run: echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish to Maven Central
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: ./gradlew :plugin-sdk:publish -PVERSION_NAME="$VERSION_NAME"

      # The Gradle step above uploads to Sonatype's OSSRH-compatibility endpoint, which parks the
      # artifacts in a legacy-style open staging repository. They are NOT visible in the Central
      # Portal, and cannot be released, until that staging repo is promoted into a Portal
      # deployment — this call does that. Without it the release silently goes nowhere: the build
      # succeeds and nothing ever appears under Deployments.
      #
      # publishing_type=automatic: Sonatype releases the deployment as soon as validation passes,
      # so pushing the tag is the whole release. Note that a Maven Central release is PERMANENT —
      # a version can be deprecated but never unpublished or replaced — so the tag is the point of
      # no return. Switch to `user_managed` to get a look at the validation result first.
      - name: Promote the staging repository into a Portal deployment
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 | tr -d '\n')
          response=$(curl -sS -w '\n%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.viperplayer?publishing_type=automatic")
          body=$(printf '%s' "$response" | sed '$d')
          code=$(printf '%s' "$response" | tail -n1)
          echo "HTTP $code"
          echo "$body"
          # A 4xx/5xx here means the artifacts are stranded in staging, so fail loudly rather than
          # reporting a green release that published nothing.
          case "$code" in
            2*) echo "Promoted and queued for automatic release: https://central.sonatype.com/publishing/deployments" ;;
            *)  echo "::error::Promotion failed - artifacts are still in staging"; exit 1 ;;
          esac
